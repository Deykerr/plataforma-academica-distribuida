spring.application.name=servicio-usuarios
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/usuarios_db}
spring.datasource.username=${DB_USERNAME:usuarios_app}
spring.datasource.password=${DB_PASSWORD:usuarios_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

app.security.jwt.secret=${JWT_SECRET:clave-local-de-desarrollo-cambiar-32-caracteres-minimo}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.email=${ADMIN_EMAIL:admin@academica.local}
app.bootstrap-admin.password=${ADMIN_PASSWORD:Admin123*}
