spring.application.name=servicio-evaluaciones
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/evaluaciones_db}
spring.datasource.username=${DB_USERNAME:evaluaciones_app}
spring.datasource.password=${DB_PASSWORD:evaluaciones_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

app.services.matriculas-url=${MATRICULAS_SERVICE_URL:http://localhost:8083}
app.security.jwt.secret=${JWT_SECRET:clave-local-de-desarrollo-cambiar-32-caracteres-minimo}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.evaluaciones.nota-aprobatoria=${NOTA_APROBATORIA:11.00}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
